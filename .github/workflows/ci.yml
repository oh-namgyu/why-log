name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      # Standard library only: nothing to install. Tests never call a model.
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Plugin manifest and schemas are valid JSON
        run: python -m json.tool .claude-plugin/plugin.json > /dev/null && for f in schemas/*.json; do python -m json.tool "$f" > /dev/null; done
